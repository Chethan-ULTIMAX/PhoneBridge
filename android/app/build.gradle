plugins { id 'com.android.application' }

android {
    namespace 'com.chethan.phonebridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chethan.phonebridge'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Keep all Kotlin runtime modules on one compatible version. Some AndroidX
    // dependencies still expose the legacy jdk7/jdk8 artifacts transitively.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
