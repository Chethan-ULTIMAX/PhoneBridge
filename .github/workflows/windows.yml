name: Windows desktop build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PhoneBridge desktop/phonebridge.py
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Windows
          path: dist/PhoneBridge.exe
