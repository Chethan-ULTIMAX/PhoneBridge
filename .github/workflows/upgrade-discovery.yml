name: Upgrade PhoneBridge discovery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch wireless discovery
        shell: python
        run: |
          from pathlib import Path
          import re

          android = Path("android/app/src/main/java/com/chethan/phonebridge/MainActivity.java")
          text = android.read_text(encoding="utf-8")
          marker = "// PHONEBRIDGE ACTIVE DISCOVERY"
          if marker not in text:
              text = text.replace(
                  "    volatile Client screenClient;",
                  "    volatile Client screenClient;\n    DatagramSocket discoverySocket;\n    Thread discoveryThread;"
              )
              text = text.replace(
                  "        server=new Server(); server.start();\n        announce=()->{ announce(); handler.postDelayed(announce,2000); };",
                  "        server=new Server(); server.start();\n        startDiscoveryResponder();\n        announce=()->{ announce(); handler.postDelayed(announce,2000); };"
              )
              method = '''\n    // PHONEBRIDGE ACTIVE DISCOVERY\n    void startDiscoveryResponder() {\n        discoveryThread = new Thread(() -> {\n            try {\n                DatagramSocket s = new DatagramSocket(DISCOVERY_PORT);\n                s.setReuseAddress(true);\n                s.setBroadcast(true);\n                discoverySocket = s;\n                byte[] buf = new byte[1024];\n                while (!Thread.currentThread().isInterrupted()) {\n                    DatagramPacket p = new DatagramPacket(buf, buf.length);\n                    s.receive(p);\n                    String msg = new String(p.getData(), p.getOffset(), p.getLength(), StandardCharsets.UTF_8).trim();\n                    if ("PHONEBRIDGE/1 PROBE".equals(msg)) {\n                        String name = Build.MODEL.replace(" ", "_");\n                        String response = "PHONEBRIDGE/1 DISCOVER " + deviceId() + " " + name + " " + server.port;\n                        byte[] out = response.getBytes(StandardCharsets.UTF_8);\n                        DatagramPacket reply = new DatagramPacket(out, out.length, p.getAddress(), p.getPort());\n                        s.send(reply);\n                    }\n                }\n            } catch (Exception ignored) {\n            }\n        }, "PhoneBridge-Discovery");\n        discoveryThread.setDaemon(true);\n        discoveryThread.start();\n    }\n'''
              text = text.replace("    String deviceId()", method + "\n    String deviceId()")
              text = text.replace(
                  "    @Override protected void onDestroy() { handler.removeCallbacks(announce); stopScreen(); if(server!=null)server.shutdown(); super.onDestroy(); }",
                  "    @Override protected void onDestroy() { handler.removeCallbacks(announce); if(discoveryThread!=null)discoveryThread.interrupt(); if(discoverySocket!=null)discoverySocket.close(); stopScreen(); if(server!=null)server.shutdown(); super.onDestroy(); }"
              )
              android.write_text(text, encoding="utf-8")

          desktop = Path("desktop/phonebridge.py")
          d = desktop.read_text(encoding="utf-8")
          if "PHONEBRIDGE_ACTIVE_PROBING" not in d:
              new_discover = '''    def discover(self):\n        # PHONEBRIDGE_ACTIVE_PROBING\n        def local_ipv4s():\n            found = set()\n            try:\n                s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n                s.connect(("192.0.2.1", 1))\n                found.add(s.getsockname()[0])\n                s.close()\n            except OSError:\n                pass\n            try:\n                for item in socket.getaddrinfo(socket.gethostname(), None, socket.AF_INET):\n                    found.add(item[4][0])\n            except OSError:\n                pass\n            return sorted(x for x in found if x and not x.startswith("127."))\n\n        def register(data, addr):\n            try:\n                p = data.decode(errors="replace").split()\n                if len(p) >= 5 and p[:2] == ["PHONEBRIDGE/1", "DISCOVER"]:\n                    self.devices[p[2]] = (p[3].replace("_", " "), addr[0], int(p[4]))\n                    self.root.after(0, self.refresh_devices)\n            except (ValueError, OSError):\n                pass\n\n        def listener():\n            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n            try:\n                s.bind(("", DISCOVERY_PORT))\n                s.settimeout(1)\n                while True:\n                    try:\n                        data, addr = s.recvfrom(2048)\n                        register(data, addr)\n                    except socket.timeout:\n                        continue\n                    except OSError:\n                        return\n            finally:\n                s.close()\n\n        def probe_loop():\n            while True:\n                try:\n                    sender = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n                    for ip in local_ipv4s():\n                        prefix = ".".join(ip.split(".")[:3])\n                        for last in range(1, 255):\n                            try:\n                                sender.sendto(b"PHONEBRIDGE/1 PROBE", (f"{prefix}.{last}", DISCOVERY_PORT))\n                            except OSError:\n                                pass\n                    sender.close()\n                except OSError:\n                    pass\n                threading.Event().wait(5)\n\n        threading.Thread(target=listener, daemon=True).start()\n        threading.Thread(target=probe_loop, daemon=True).start()\n'''
              d = re.sub(r"    def discover\(self\):.*?(?=    def refresh_devices\(self\):)", new_discover + "\n", d, flags=re.S)
              d = d.replace(
                  'return messagebox.showinfo("PhoneBridge", "No phone discovered. Use the same Wi-Fi.")',
                  'return messagebox.showinfo("PhoneBridge", "No phone discovered. Keep PhoneBridge open on the phone and make sure the devices share a local network or hotspot.")'
              )
              desktop.write_text(d, encoding="utf-8")

          protocol = Path("protocol/PROTOCOL.md")
          p = protocol.read_text(encoding="utf-8") if protocol.exists() else ""
          note = '''\n### Active local discovery\n\nThe desktop client listens on UDP `38741` and periodically sends `PHONEBRIDGE/1 PROBE` to the local IPv4 `/24` addresses. Android PhoneBridge responds directly with the normal `PHONEBRIDGE/1 DISCOVER` message containing its device ID, model, and TCP server port. This supplements broadcast discovery and supports networks where broadcast announcements do not reach the desktop, including common phone-hotspot layouts.\n'''
          if "### Active local discovery" not in p:
              protocol.write_text(p.rstrip() + "\n" + note, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/chethan/phonebridge/MainActivity.java desktop/phonebridge.py protocol/PROTOCOL.md
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "feat: add active local discovery for hotspot and multi-phone networks"
            git push
          fi
